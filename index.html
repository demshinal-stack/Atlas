/* если что-то пойдёт не так — покажем причину вместо белого экрана */
(function () {
  var boot = document.getElementById("boot");
  var shown = false;
  function fail(msg) {
    if (shown) return;
    shown = true;
    if (!boot) return;
    boot.style.flexDirection = "column";
    boot.style.padding = "24px";
    boot.style.textAlign = "center";
    boot.style.gap = "14px";
    boot.innerHTML =
      '<div style="font-size:15px;color:#e8967f">Приложение не запустилось</div>' +
      '<div style="font-size:12px;line-height:1.5;color:#8fa4b8;max-width:320px">' +
      String(msg).slice(0, 300) +
      "</div>" +
      '<button id="rt" style="padding:12px 18px;border-radius:11px;border:0;background:#e8b84b;color:#1a1206;font-size:14px">Перезагрузить</button>';
    var b = document.getElementById("rt");
    if (b)
      b.onclick = function () {
        if (window.caches && caches.keys)
          caches.keys().then(function (ks) {
            ks.forEach(function (k) {
              caches.delete(k);
            });
            location.reload(true);
          });
        else location.reload(true);
      };
  }
  window.addEventListener("error", function (e) {
    fail((e && e.message) || "ошибка загрузки");
  });
  window.addEventListener("unhandledrejection", function (e) {
    fail((e && e.reason && e.reason.message) || "ошибка загрузки");
  });
  setTimeout(function () {
    if (typeof React === "undefined")
      fail("Не загрузились библиотеки. Проверьте подключение к сети.");
    else if (document.getElementById("root") &&
             !document.getElementById("root").childNodes.length)
      fail("Экран не отрисовался. Попробуйте перезагрузить.");
  }, 6000);
})();
</script>

/* значки: один рисунок на все страны, по нему вырезаем нужную клетку */
let BADGE = { cols: 14, cell: 56, index: {}, ready: false };
const badgeStyle = (a3) => {
    const i = BADGE.index[a3];
    if (i === undefined)
        return null;
    const x = (i % BADGE.cols) * BADGE.cell;
    const y = Math.floor(i / BADGE.cols) * BADGE.cell;
    return {
        backgroundImage: "url(./data/badges.webp)",
        backgroundPosition: `-${x}px -${y}px`,
        width: BADGE.cell,
        height: BADGE.cell,
    };
};

let HOTELS_BY_CITY = {};
let HOTEL_CAT = {};
let SIGHTS = [];

let booksBytes = 0;
const parseCities = (raw) => {
    const out = [];
    (raw || "").split("\n").forEach((l) => {
        const [a3, list] = l.split("|");
        if (!list)
            return;
        list.split(";").forEach((city) => {
            if (city.trim())
                out.push({ a3, city: city.trim() });
        });
    });
    return out;
};
const parseHotels = (raw) => {
    const by = {};
    const cat = {};
    (raw || "").split("\n").forEach((row) => {
        const [city, list] = row.split("|");
        if (!city || !list)
            return;
        by[city.trim()] = list.split(";").map((x) => {
            const [name, stars] = String(x).split("*");
            const h = { name: name.trim(), cat: stars ? +stars : 0 };
            if (h.cat)
                cat[h.name] = h.cat;
            return h;
        });
    });
    return { by, cat };
};
const parseSights = (raw) => {
    const list = [];
    (raw || "").split("\n").forEach((row) => {
        const [a3, items] = row.split("|");
        if (!a3 || !items)
            return;
        items.split(";").forEach((x) => {
            const [name, city] = x.split("@");
            if (name)
                list.push({ a3, name: name.trim(), city: (city || "").trim() });
        });
    });
    return list;
};
const parseRegions = (raw) => {
    const by = {};
    (raw || "").split("\n").forEach((row) => {
        const [a3, list] = row.split("|");
        if (!a3 || !list)
            return;
        by[a3.trim()] = list.split(";").map((x) => x.trim()).filter(Boolean);
    });
    return by;
};
const parsePhrases = (raw) => {
    const by = {};
    (raw || "").split("\n").forEach((row) => {
        // сами фразы содержат «|», поэтому делим только по первому
        const i = row.indexOf("|");
        if (i < 1)
            return;
        const lang = row.slice(0, i).trim();
        by[lang] = row
            .slice(i + 1)
            .split(";")
            .filter(Boolean);
    });
    return by;
};
/* какой город в каком регионе: A3|Город=Регион;… */
let CITY_REG = {};
const parseCityRegions = (raw) => {
    const out = {};
    (raw || "").split("\n").forEach((row) => {
        const [a3, rest] = row.split("|");
        if (!a3 || !rest)
            return;
        const m = (out[a3.trim()] = out[a3.trim()] || {});
        rest.split(";").forEach((e) => {
            const [city, reg] = e.split("=");
            if (city && reg)
                m[city.trim()] = reg.trim();
        });
    });
    return out;
};
const regionOf = (a3, city) => (CITY_REG[a3] || {})[city] || null;
/* авиакомпания по коду; «~Название» — своя, которой нет в справочнике */
const airInfo = (code) => {
    if (!code)
        return undefined;
    if (AIRLINES[code])
        return AIRLINES[code];
    if (!String(code).startsWith("~"))
        return undefined;
    const name = String(code).slice(1);
    let h = 0;
    for (const ch of name)
        h = (h * 31 + ch.charCodeAt(0)) % 360;
    if (h > 190 && h < 248)
        h = (h + 80) % 360; // мимо синих тонов глобуса
    return {
        code,
        name,
        a3: "",
        year: null,
        routes: "",
        alliance: "",
        color: "#3b4b5c",
        arc: (() => {
            // оттенок в hex, чтобы цвета дуг можно было сравнивать
            const l = 0.62;
            const k = (n) => (n + h / 30) % 12;
            const f = (n) => l - 0.8 * Math.min(l, 1 - l) * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
            const x = (v) => Math.round(v * 255).toString(16).padStart(2, "0");
            return `#${x(f(0))}${x(f(8))}${x(f(4))}`;
        })(),
        own: true,
    };
};
/* авиакомпании: код|название|страна|год|направления|альянс|цвет */
let AIRLINES = {};
const parseAirlines = (raw) => {
    const out = {};
    (raw || "").split("\n").forEach((row) => {
        const [code, name, a3, year, routes, alliance, color, arc] = row.split("|");
        if (!code || !name)

.shelf-top{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
.shelf-top b{font-family:Georgia,serif; font-size:1.3rem; font-weight:400; color:var(--gold);}
.shelf-top span{font-size:0.72rem; color:var(--dim);}
.shelf{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-top:12px;}
.shelf-cell{display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 4px; border-radius:12px; border:1px solid var(--line); background:var(--el); color:var(--ink); font-family:inherit; cursor:pointer;}
.shelf-flag{display:flex; align-items:center; justify-content:center; width:56px; height:56px; font-size:1.9rem; border-radius:12px; background:var(--field); border:1px solid var(--line);}
.shelf-cell i{display:block; background-repeat:no-repeat; filter:grayscale(1) brightness(.55); transition:filter .25s ease;}
.shelf-cell:not(.got) .shelf-flag{opacity:.5;}
.shelf-cell.got i{filter:none;}
.shelf-cell.wish i{filter:grayscale(.55) brightness(.8);}
.shelf-cell em{font-style:normal; font-size:0.58rem; line-height:1.15; text-align:center; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}
.shelf-cell.got{border-color:rgba(232,184,75,.4);}
.shelf-cell.got em{color:var(--ink);}
.crew{display:flex; flex-direction:column; gap:10px;}
.crew-row{padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--field);}
.crew-row.me{border-color:rgba(232,184,75,.45);}
.crew-top{display:flex; align-items:center; gap:9px; min-width:0;}
.crew-rank{flex:none; width:18px; font-size:0.7rem; color:var(--dim);}
.crew-name{flex:1 1 auto; min-width:0; font-size:0.86rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.crew-name i{font-style:normal; margin-left:7px; font-size:0.64rem; color:var(--dim);}
.crew-big{flex:none; font-family:Georgia,serif; font-size:1.2rem; color:var(--gold);}
.crew-bar{display:block; height:7px; margin:8px 0 9px; border-radius:4px; background:var(--track); overflow:hidden;}
.crew-bar i{display:block; height:100%; border-radius:4px;}
.crew-cells{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px;}
.crew-cells span{display:flex; flex-direction:column; gap:1px; font-size:0.58rem; line-height:1.15; color:var(--dim); text-align:center;}
.crew-cells b{font-family:Georgia,serif; font-size:0.9rem; font-weight:400; color:var(--ink);}
.rows-chart{display:flex; flex-direction:column; gap:8px;}
.row-line{display:flex; align-items:center; gap:9px; min-width:0;}
.row-k{flex:0 0 32%; min-width:0; font-size:0.76rem; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-bar{flex:1 1 auto; min-width:0; height:12px; border-radius:6px; background:var(--field); overflow:hidden;}
.row-bar i{display:block; height:100%; border-radius:6px;}
.row-v{flex:none; font-size:0.72rem; color:var(--ink);}
.grid-chart{font-size:0.62rem; color:var(--dim);}
.grid-head,.grid-row{display:flex; align-items:center; gap:3px; margin-bottom:3px;}
.grid-head span,.grid-row .grid-cell{flex:1 1 0;}
.grid-head span:first-child,.grid-y{flex:0 0 30px;}
.grid-head span{text-align:center;}
.grid-cell{height:16px; border-radius:4px; background:var(--field); transition:transform .18s;}
.grid-row.vague{position:relative;}
.grid-row.vague::after{content:""; position:absolute; left:33px; right:0; top:0; bottom:0; border-radius:4px; pointer-events:none;
  background:repeating-linear-gradient(135deg, rgba(232,184,75,.16) 0 5px, transparent 5px 10px);}
/* дорожки, пары, свои/общие, первооткрыватели, широты */
.lanes{display:flex; flex-direction:column; gap:5px;}
.lane-grid{display:grid; align-items:center; gap:4px 3px;}
.lane-n{font-size:0.66rem; color:var(--dim); white-space:nowrap; padding-right:6px;}
.lane-y{text-align:center; font-size:0.55rem; color:var(--dim);}
.lane-c{height:20px; display:flex; align-items:center; justify-content:center;}
.lane-c i{display:block; border-radius:50%;}
.lane-c u{display:block; width:4px; height:4px; border-radius:50%; background:var(--track);}
.grid-legend .lg{display:inline-flex; align-items:center; gap:4px; margin-right:8px;}
.grid-legend .lg i{margin-left:0;}

.firsts{display:flex; flex-direction:column; gap:8px;}
.fr-row{display:grid; grid-template-columns:auto auto 1fr; gap:10px; align-items:center;
  padding:11px 12px; border-radius:14px; border:1px solid var(--line); background:var(--field);}
.fr-row.top{border-color:rgba(232,184,75,.55); background:linear-gradient(135deg, rgba(232,184,75,.1), transparent 55%), var(--field);}
.fr-rank{position:relative; flex:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:0.74rem; font-weight:600; color:var(--dim); border:1px solid var(--line);}
.fr-row.top .fr-rank, .fw-card.top .fr-rank{color:#11202e; background:var(--gold); border-color:var(--gold);}
.fr-rank u{position:absolute; top:-13px; left:50%; transform:translateX(-50%); text-decoration:none; color:var(--gold); font-size:0.7rem;}
.fr-num{display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:52px;
  padding:6px 8px; border-radius:11px; border:1px solid var(--line); background:rgba(255,255,255,.03);}
.fr-num b{font-size:1.25rem; font-weight:700; color:var(--gold); line-height:1;}
.fr-num em{font-style:normal; font-size:0.58rem; color:var(--dim);}
.fr-main{min-width:0; display:flex; flex-direction:column; gap:3px;}
.fr-main > b{font-size:0.86rem;}
.fr-main > em{font-style:normal; font-size:0.66rem; color:var(--dim);}
.fr-chip{display:inline-flex; align-items:center; gap:5px; flex-wrap:wrap; align-self:flex-start;
  padding:5px 9px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.03);
  font-size:0.68rem; color:var(--dim); margin-top:2px;}
.fr-chip b{font-weight:500; color:var(--text);}
.fr-chip i{font-style:normal; font-size:0.72rem;}
.fr-row.top .fr-chip{border-color:rgba(232,184,75,.4);}
.fr-dot em{white-space:nowrap;}
.fr-line{display:flex; align-items:flex-start; gap:2px; margin-top:4px;}
.fr-dot{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; position:relative;}
.fr-dot::before{content:""; position:absolute; top:4px; left:-50%; width:100%; height:1px; background:var(--line);}
.fr-dot:first-child::before{display:none;}
.fr-dot i{width:8px; height:8px; border-radius:50%; background:#2f435a; position:relative;}
.fr-dot.on i{background:#8fd4ff; box-shadow:0 0 8px rgba(143,212,255,.8);}
.fr-line.gold .fr-dot.on i{background:var(--gold); box-shadow:0 0 9px rgba(232,184,75,.85);}
.fr-dot em{font-style:normal; font-size:0.5rem; color:var(--dim);}
.fr-dot.on em{color:var(--text);}
.fr-note{display:flex; gap:10px; padding:11px 12px; border-radius:14px; border:1px solid var(--line); background:var(--field);}
.fr-note i{flex:none; font-style:normal; color:#8fb3d6; font-size:1rem;}
.fr-note span{display:flex; flex-direction:column; gap:3px;}
.fr-note b{font-size:0.8rem;}
.fr-note em{font-style:normal; font-size:0.68rem; color:var(--dim); line-height:1.4;}
/* во весь экран */
.fw-panel{flex-direction:column; gap:10px;}
.fw-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.fw-head b{font-size:1.05rem;}
.fw-head em{display:block; font-style:normal; font-size:0.72rem; color:var(--dim); margin-top:2px;}
.fw-head .zoom-x{position:static; flex:none;}
.fw-cards{flex:1 1 auto; min-height:0; display:flex; gap:10px; overflow-x:auto; overscroll-behavior:contain;}
.fw-card{flex:0 0 clamp(210px, 31%, 330px); min-width:0; display:flex; flex-direction:column; gap:9px; padding:12px;
  border-radius:16px; border:1px solid var(--line); background:var(--field); text-align:left;}
.fw-card .fr-rank, .fw-item .fr-rank{flex:none; width:28px; height:28px;}
.fw-card{align-items:stretch;}
.fw-card > *{align-self:stretch;}
.fw-card .fw-card-head{justify-content:flex-start;}
.fw-card .fw-more{justify-content:flex-start;}
.fw-card.top{border-color:rgba(232,184,75,.55); background:linear-gradient(140deg, rgba(232,184,75,.1), transparent 60%), var(--field);}
.fw-card-head{display:flex; align-items:center; gap:9px;}
.fw-card-head b{font-size:0.9rem;}
.fw-nums{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;}
.fw-nums > span{flex:1 1 0; display:flex; flex-direction:column; align-items:center; padding:7px 4px; border-radius:11px;
  background:rgba(255,255,255,.04);}
.fw-nums b{font-size:1.15rem; font-weight:700; color:var(--gold); line-height:1;}
.fw-nums em{font-style:normal; font-size:0.56rem; color:var(--dim);}
.fw-first{display:flex; flex-direction:column; gap:2px; padding:8px 10px; border-radius:11px; border:1px solid var(--line);}
.fw-first b{font-size:0.82rem;}
.fw-first em{font-style:normal; font-size:0.62rem; color:var(--dim);}
.fw-sum{flex:none; display:flex; gap:16px; padding:10px 12px; border-radius:14px; border:1px solid var(--line);
  background:rgba(255,255,255,.02); text-align:left;}
.fw-sum span{display:flex; flex-direction:column;}
.fw-sum b{font-size:1.1rem; font-weight:700; color:var(--gold); line-height:1.1;}
.fw-sum em{font-style:normal; font-size:0.6rem; color:var(--dim);}
.fw-port{gap:10px;}
.fw-list{display:flex; flex-direction:column; gap:6px;}
.fw-item{display:flex; align-items:center; gap:10px; text-align:left; padding:9px 11px; border-radius:12px; border:1px solid var(--line);
  background:var(--field); color:var(--text); cursor:pointer; text-align:left;}
.fw-item > span:not(.fr-rank){flex:1 1 auto; min-width:0; display:flex; flex-direction:column; align-items:flex-start;}
.fw-item b{font-size:0.8rem; font-weight:500;}
.fw-item em{font-style:normal; font-size:0.64rem; color:var(--dim);}
.fw-item i{flex:none; font-style:normal; color:var(--dim);}
.fw-more{display:flex; flex-wrap:wrap; gap:6px;}
.fw-more span{display:flex; align-items:center; gap:5px; padding:5px 9px; border-radius:10px;
  border:1px solid var(--line); font-size:0.7rem;}
.fw-more u{text-decoration:none; color:var(--dim); font-size:0.62rem;}
.split{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:9px 8px; font-size:0.68rem;}
.split-n{color:var(--text); white-space:nowrap;}
.split-bar{height:8px; border-radius:4px; background:var(--track); overflow:hidden; display:flex;}
.split-bar i{display:block; height:100%;}
.split-legend{grid-column:1 / -1;}
.split-bar .sh{background:#4a7fb5;}
.split-bar .ow{background:#e2b551;}
.split-v{text-align:right; color:var(--dim); font-size:0.62rem; white-space:nowrap;}

.first-row{display:flex; align-items:center; gap:10px;}
.first-pill{flex:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--gold); color:#1a1206; font-weight:600; font-size:0.85rem;}
.first-n{display:flex; flex-direction:column; font-size:0.74rem;}
.first-n em{font-style:normal; font-size:0.6rem; color:var(--dim);}


.crew-top{width:100%; cursor:pointer; text-align:left;}
.crew-caret{flex:none; margin-left:8px; color:var(--dim); font-size:0.7rem; transition:transform .18s;}
.crew-caret.on{transform:rotate(180deg); color:var(--gold);}
.crew-globe{flex:none; display:flex; align-items:center; justify-content:center; width:30px; height:30px;
  padding:0; border-radius:9px; border:1px solid var(--line); background:var(--field); color:var(--dim); cursor:pointer;}
.crew-globe:active{color:var(--gold); border-color:rgba(232,184,75,.45);}
/* окно человека начинается сразу под шапкой шторки */
.zoom-layer.pg-layer{align-items:flex-start; bottom:var(--tabh);
  padding-top:calc(env(safe-area-inset-top) + 46px); padding-bottom:10px;}
.pg-layer .zoom-box{align-self:stretch; max-height:100%; display:flex; flex-direction:column; overflow:hidden;}
.pg-layer .zoom-body{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
.pg-layer .span-globe{flex:1 1 auto; min-height:120px; justify-content:center;}
.pg-list{display:none;}
.air-open-globe{flex:none; order:3;}
.ag-side{gap:10px;}
.ag-side .pg-side-head{padding-right:0; align-items:center; justify-content:space-between; min-height:40px;}
.ag-side .pg-side-head .zoom-x{position:static; flex:none;}
.ag-tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.ag-tile{display:flex; flex-direction:column; gap:3px; padding:11px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--field); min-width:0;}
.ag-tile.ag-km{grid-column:1 / -1;}
.ag-tile b{font-size:1.3rem; font-weight:700; color:var(--gold); line-height:1.1;}
.ag-tile em{font-style:normal; font-size:0.72rem; color:var(--dim); line-height:1.3;}
.ag-sel{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:8px;}
.ag-sel-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.ag-sel-head b{font-size:0.9rem;}
.ag-sel-head em{font-style:normal; font-size:0.66rem; color:var(--dim);}
.ag-dot{flex:none; width:10px; height:10px; border-radius:50%; box-shadow:0 0 6px currentColor;}
.ag-list{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:6px; overflow-y:auto;
  overscroll-behavior:contain; touch-action:pan-y;}
.ag-row{flex:none; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px;
  border:1px solid var(--line); background:var(--field);}
.ag-row .air-mark{width:36px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center;
  font-style:normal; font-size:0.64rem; font-weight:600; color:#fff;}
.ag-row span{display:flex; flex-direction:column; min-width:0;}
.ag-row b{font-size:0.8rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ag-row em{font-style:normal; font-size:0.66rem; color:var(--dim);}
.ag-hint{justify-content:center; padding:14px; border-radius:14px; border:1px dashed var(--line);}
.ag-hint p{margin:0; font-size:0.74rem; color:var(--dim); line-height:1.45;}
.ag-frame{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; padding:10px; border-radius:14px;
  border:1px solid var(--line); background:rgba(255,255,255,.02); overflow:hidden;}
.ag-frame .ag-sel{flex:1 1 auto; min-height:0;}
.ag-frame .ag-hint{border:0; padding:4px;}
.pg-layer .ag-frame{flex:none; height:30vh; height:30dvh; margin-top:8px;}
.ag-card{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:10px; padding:12px 14px; border-radius:14px;
  border:1px solid color-mix(in srgb, var(--ac) 55%, var(--line)); background:
  linear-gradient(135deg, color-mix(in srgb, var(--ac) 16%, transparent), transparent 60%), var(--field);}
.ag-card-head{display:flex; align-items:center; gap:10px;}
.ag-card-head .air-mark{width:42px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-style:normal; font-size:0.7rem; font-weight:600; color:#fff;}
.ag-card-head span{display:flex; flex-direction:column; min-width:0;}
.ag-card-head b{font-size:0.9rem;}
.ag-card-head em{font-style:normal; font-size:0.62rem; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ag-card-nums{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;}
.ag-card-nums span{padding:7px 8px; border-radius:10px; background:rgba(255,255,255,.04); text-align:center;}
.ag-card-nums b{font-size:0.74rem; font-weight:600; color:var(--ac);}
.ag-card-foot{font-style:normal; font-size:0.64rem; color:var(--text); line-height:1.35;}
.pg-layer .ag-tiles{margin-top:8px;}
.pg-layer .ag-card{flex:none; margin-top:8px;}
.rep-body{display:flex; flex-direction:column;}
.rs-list{display:flex; flex-direction:column; gap:5px; margin-bottom:6px;}
.rs-row{display:flex; align-items:center; gap:10px; padding:7px 8px 7px 10px; border-radius:11px;
  border:1px solid var(--line); background:var(--field);}
.rs-row.off .rs-name{color:var(--dim);}
.rs-check{flex:none; width:24px; height:24px; border-radius:7px; border:1px solid var(--line); background:none;
  color:#0b1622; font-size:0.8rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.rs-check.on{background:var(--gold); border-color:var(--gold);}
.rs-name{flex:1 1 auto; min-width:0; font-size:0.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rs-arrow{flex:none; width:32px; height:30px; border-radius:9px; border:1px solid var(--line); background:none;
  color:var(--text); font-size:0.85rem; cursor:pointer;}
.rs-arrow:disabled{opacity:.3; cursor:default;}
.far-card{position:relative;}
/* сезонность */
.sd-inline{max-width:330px; margin:4px auto 0;}
.sd{display:block; width:100%; height:auto; overflow:visible; font-family:inherit;}
.sd .sd-base, .sd .sd-lab, .sd .sd-center, .sd .sd-tip{opacity:0;}
.sd .sd-seg{transform-box:fill-box; transform-origin:50% 100%; transform:scaleY(.05); opacity:0;}
.reveal.in .sd .sd-base, .sd.play .sd-base{animation:sdFade .3s ease-out 0s both;}
.reveal.in .sd .sd-lab, .sd.play .sd-lab{animation:sdFade .5s ease-out .3s both;}
.reveal.in .sd .sd-seg, .sd.play .sd-seg{animation:sdGrow .45s cubic-bezier(.2,.8,.3,1.15) both;}
.reveal.in .sd .sd-center, .sd.play .sd-center{animation:sdFade .4s ease-out 1.6s both;}
.reveal.in .sd .sd-key, .sd.play .sd-key{animation:sdGrow .45s cubic-bezier(.2,.8,.3,1.15) both, sdPulse 1.4s ease-in-out 2s 1;}
.reveal.in .sd .sd-tip, .sd.play .sd-tip{animation:sdFade .5s ease-out 2.5s both;}
.sd-tip{pointer-events:none;}
@keyframes sdFade{from{opacity:0} to{opacity:1}}
@keyframes sdGrow{from{opacity:0; transform:scaleY(.05)} to{opacity:1; transform:scaleY(1)}}
@keyframes sdPulse{0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35)}}
@media (prefers-reduced-motion: reduce){
  .sd .sd-base, .sd .sd-lab, .sd .sd-center, .sd .sd-tip, .sd .sd-seg{animation:none !important; opacity:1; transform:none;}
}
.sd-stage{flex:1 1 auto; align-self:stretch; width:100%; height:100%; min-height:0;
  display:flex; align-items:center; justify-content:center;}
.sd-frame{gap:8px; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y;}
.donut-row.donut-big{width:100%; height:100%;}
.donut-row.donut-big .donut{flex:1 1 auto; width:100%; height:100%; max-width:none;}
.donut-row.donut-big .donut-legend{display:none !important;}
.donut-row .donut-legend div{cursor:pointer;}
.donut-row .donut-legend div.on{color:var(--gold);}
.ct-list{display:flex; flex-direction:column; gap:5px;}
.ct-row{display:flex !important; flex-direction:row !important; align-items:center; gap:9px;
  padding:8px 11px; border-radius:11px; border:1px solid var(--line); background:var(--field); text-align:left;}
.ct-flag{flex:none; font-size:1.05rem;}
.ct-name{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; align-items:flex-start; font-size:0.78rem;}
.ct-name em{font-style:normal; font-size:0.62rem; color:var(--dim);}
.ct-row b{flex:none; font-size:0.72rem; font-weight:500; color:var(--dim);}
.sd-cards{display:flex; flex-direction:column; gap:8px;}
.sd-card{display:flex; flex-direction:column; gap:3px; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--field);}
.sd-card em{font-style:normal; font-size:0.66rem; color:var(--dim);}
.sd-card span{font-size:0.72rem; color:var(--text);}
.sd-row{flex-direction:row; align-items:center; justify-content:space-between;}
.sd-big{font-size:1.5rem; font-weight:700; color:var(--gold); line-height:1.1;}
.sd-mname{font-size:1.05rem; font-weight:600;}
.sd-nums{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:4px 0 6px;}
.sd-nums span{display:flex; flex-direction:column; padding:7px 9px; border-radius:10px; background:rgba(255,255,255,.04);}
.sd-nums b{font-size:1.1rem; color:var(--gold);}
.sd-top{display:flex; flex-direction:column; gap:4px; margin-top:2px;}
.sd-top span{display:flex; align-items:center; gap:6px; font-size:0.74rem;}

/* появление графиков по мере прокрутки */
.reveal{opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.3,1);}
.reveal.in{opacity:1; transform:none;}

.reveal .bar-g rect{transform:scaleY(0); transition:transform .7s cubic-bezier(.2,.8,.25,1); transition-delay:var(--d, 0ms);}
.reveal.in .bar-g rect{transform:scaleY(1);}
.reveal .bar-g text{opacity:0; transition:opacity .4s ease; transition-delay:var(--d, 0ms);}
.reveal.in .bar-g text{opacity:1;}

.reveal .trend{stroke-dasharray:1200; stroke-dashoffset:1200; transition:stroke-dashoffset 1.3s ease .35s;}
.reveal.in .trend{stroke-dashoffset:0;}

.reveal .area-line{stroke-dasharray:1400; stroke-dashoffset:1400; transition:stroke-dashoffset 1.4s ease .15s;}
.reveal.in .area-line{stroke-dashoffset:0;}
.reveal .area-fill{opacity:0; transition:opacity .9s ease .5s;}
.reveal.in .area-fill{opacity:1;}

.reveal .donut path{stroke-dasharray:400; stroke-dashoffset:400; transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1);}
.reveal.in .donut path{stroke-dashoffset:0;}

.reveal .season line{transform:scale(.1); transform-origin:center; transition:transform .7s cubic-bezier(.2,.9,.3,1);}
.reveal.in .season line{transform:scale(1);}
