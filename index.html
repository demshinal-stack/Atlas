<script>
/* если что-то пойдёт не так — покажем причину вместо белого экрана */
(function () {
  var boot = document.getElementById("boot");
  var shown = false;
  function fail(msg) {
    if (shown) return;
    shown = true;
    if (!boot) return;
    boot.style.flexDirection = "column";
    boot.style.padding = "24px";
    boot.style.textAlign = "center";
    boot.style.gap = "14px";
    boot.innerHTML =
      '<div style="font-size:15px;color:#e8967f">Приложение не запустилось</div>' +
      '<div style="font-size:12px;line-height:1.5;color:#8fa4b8;max-width:320px">' +
      String(msg).slice(0, 300) +
      "</div>" +
      '<button id="rt" style="padding:12px 18px;border-radius:11px;border:0;background:#e8b84b;color:#1a1206;font-size:14px">Перезагрузить</button>';
    var b = document.getElementById("rt");
    if (b)
      b.onclick = function () {
        if (window.caches && caches.keys)
          caches.keys().then(function (ks) {
            ks.forEach(function (k) {
              caches.delete(k);
            });
            location.reload(true);
          });
        else location.reload(true);
      };
  }
  window.addEventListener("error", function (e) {
    fail((e && e.message) || "ошибка загрузки");
  });
  window.addEventListener("unhandledrejection", function (e) {
    fail((e && e.reason && e.reason.message) || "ошибка загрузки");
  });
  setTimeout(function () {
    if (typeof React === "undefined")
      fail("Не загрузились библиотеки. Проверьте подключение к сети.");
    else if (document.getElementById("root") &&
             !document.getElementById("root").childNodes.length)
      fail("Экран не отрисовался. Попробуйте перезагрузить.");
  }, 6000);
})();
</script>

const SILVER = "#c3ced9";
const SILVER_LINE = "rgba(198,210,222,.72)";
const GOLD_FILL = "#e2b551";
function fillStyleFor(ctx, a3, bounds, wish) {
    if (wish) {
        if (!bounds)
            return WISH_FILL;
        const [[x0, y0], [x1, y1]] = bounds;
        if (!isFinite(x0) || !isFinite(y1))
            return WISH_FILL;
        const g = ctx.createLinearGradient(x0, y0, x1, y1);
        g.addColorStop(0, "#5e93c9");
        g.addColorStop(1, "#33608f");
        return g;
    }
    if (a3 === "RUS") {
        if (!bounds)
            return SILVER;
        const [[x0, y0], [x1, y1]] = bounds;
        if (!isFinite(x0) || !isFinite(y1))
            return SILVER;
        const g = ctx.createLinearGradient(x0, y0, x1, y1);
        g.addColorStop(0, "#d7e1ea");
        g.addColorStop(0.5, SILVER);
        g.addColorStop(1, "#a8b6c4");
        return g;
    }
    if (!bounds)
        return GOLD_FILL;
    const [[x0, y0], [x1, y1]] = bounds;
    if (!isFinite(x0) || !isFinite(y1))
        return GOLD_FILL;
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, "#f0cc72");
    g.addColorStop(0.5, GOLD_FILL);
    g.addColorStop(1, "#c9982f");
    return g;
}
